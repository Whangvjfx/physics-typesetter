<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>A4 物理排版 · 终极完美版 (V42 黑体标签)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="物理排版">
  <meta name="theme-color" content="#07090e">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>

  <div id="capture-zone"></div>

  <div id="app-container">
    <!-- 顶部复古未来感 HUD 仪表盘头部 -->
    <header class="hud-header">
      <div class="brand-section">
        <h1 class="brand-title">
          <span>⚡ A4 物理排版</span>
          <span class="brand-tag">V42 PRO</span>
        </h1>
        <p class="brand-sub">手写公式 · 60px 规整对齐 · 智能防截断分页</p>
      </div>
      <div class="hud-telemetry">
        <div class="theme-segmented-control" id="theme-segmented-control">
          <button type="button" class="theme-seg-btn" data-theme-val="auto" title="跟随系统">🌓 自动</button>
          <button type="button" class="theme-seg-btn" data-theme-val="light" title="清爽绿意日间模式">☀️ 白天</button>
          <button type="button" class="theme-seg-btn" data-theme-val="dark" title="复古未来黑夜模式">🌙 黑夜</button>
        </div>
        <div class="telemetry-badge">
          <span class="status-dot"></span>
          <span>ONLINE</span>
        </div>
      </div>
    </header>

    <!-- 主工作区：自适应 iPad 双栏 / iPhone 单栏 -->
    <main class="main-workspace">
      <!-- 左侧控制台 (Control Deck) -->
      <section class="control-deck">
        <div class="deck-section-title">
          <span>⚙️ // INPUT & ASSETS</span>
        </div>

        <!-- 图片上传区 -->
        <input type="file" id="image-upload" accept="image/*" style="display: none;">
        <div class="upload-card" id="upload-btn">
          <div id="preview-img-container">📷 点击上传配图 / 剪贴板粘贴 (可选)</div>
        </div>

        <!-- 图片大小调节滑块 -->
        <div class="slider-deck">
          <div class="slider-deck-header">
            <span>图片渲染宽度</span>
            <span class="slider-deck-value" id="img-scale-val">250 px</span>
          </div>
          <input type="range" id="img-scale" min="100" max="400" step="5" value="250">
        </div>

        <!-- 文本输入区 -->
        <div class="editor-container">
          <div class="deck-section-title">
            <span>📝 // PARSE TEXT INPUT</span>
          </div>
          <textarea 
            id="ai-input" 
            class="cyber-textarea" 
            placeholder="请将 AI 输出的纯文本解析复制粘贴到这里...&#10;支持使用 \ 强制人工换行 · 支持 $...$ 与 $$...$$ LaTeX 公式&#10;支持 <red>文本</red> 标红重点内容"
          ></textarea>
        </div>

        <!-- 快捷工具栏 (包含专用 \\ 按钮) -->
        <div class="quick-toolbar">
          <button type="button" class="quick-btn btn-backslash" id="btn-insert-backslash" title="在当前光标位置插入 \\ 强制换行">
            <span>\\</span>
            <span style="font-size: 11px; opacity: 0.9;">插入换行</span>
          </button>
          <button type="button" class="quick-btn btn-paste" id="btn-paste-text">
            <span>📋 粘贴</span>
          </button>
          <button type="button" class="quick-btn btn-sample" id="btn-load-sample">
            <span>✨ 填入示例</span>
          </button>
          <button type="button" class="quick-btn btn-clear" id="btn-clear-all">
            <span>🗑️ 清空</span>
          </button>
        </div>

        <!-- 核心操作按钮 -->
        <div class="action-deck">
          <button type="button" class="gen-btn" id="gen-btn">
            <span>⚡ 一键自动排版并生成图片</span>
          </button>
        </div>
      </section>

      <!-- 右侧/下方输出与预览区 (Output Bay) -->
      <section class="output-bay">
        <div class="output-header">
          <div class="output-header-title">
            <span>📊 // RENDER OUTPUT</span>
            <span id="output-count-badge" style="font-size: 11px; color: var(--amber-gold);">[ 待生成 ]</span>
          </div>
          <div>
            <button type="button" class="batch-save-btn" id="btn-batch-save" style="display: none;">
              <span>💾 一键保存到相册</span>
            </button>
          </div>
        </div>

        <div class="output-container" id="output-container">
          <div class="empty-state" id="empty-state">
            <div class="empty-state-icon">📄</div>
            <div style="font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;">等待排版任务</div>
            <div style="font-size: 13px; max-width: 320px; line-height: 1.5;">在左侧输入解析文本与公式后，点击「一键自动排版」即可生成高清 A4 规整手写解答图片</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 全屏图片查看器 -->
  <div id="lightbox" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 10000; align-items: center; justify-content: center; padding: 20px;">
    <img id="lightbox-img" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px;">
    <button id="lightbox-close" style="position: absolute; top: calc(20px + env(safe-area-inset-top)); right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer;">✕</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
