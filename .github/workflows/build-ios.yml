name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sync iOS Capacitor Project
        run: npx cap sync ios

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS App (Unsigned for AltStore / Sideloadly / TrollStore)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r PhysicsTypesetter.ipa Payload
          ls -lh PhysicsTypesetter.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsTypesetter-iOS-IPA
          path: PhysicsTypesetter.ipa
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: PhysicsTypesetter.ipa
          name: Physics Typesetter Release ${{ github.ref_name }}
          body: |
            ## 🚀 A4 物理排版 iOS 安装包
            - **文件**: `PhysicsTypesetter.ipa`
            - **安装方式**: 支持使用 AltStore、Sideloadly、TrollStore、爱思助手等工具在 Windows 下直接自签刷入 iPhone / iPad。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
